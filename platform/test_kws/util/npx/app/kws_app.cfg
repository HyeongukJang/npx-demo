[preprocess]
input=speechcommands_opendataset
timesteps=4
step_generation=direct
feature=mel_spectrogram
mel_spectrogram.num_samples=16000
mel_spectrogram.sample_rate=16000
mel_spectrogram.n_fft=512
mel_spectrogram.win_length=400
mel_spectrogram.hop_length=320
mel_spectrogram.n_mels=40

[train]
epoch=50
kfold=5
repeat=1

[global]
input_size=49,40
input_channels=1
output_classes=3
neuron_type=q8ssf

# 1x49x40 -> 8x45x36
[Conv2d]
in_channels=1
out_channels=8
kernel_size=5
stride=1
padding=0
#bias=False

# 8x45x36 -> 8x22x18
[MaxPool2d]
kernel_size=2
padding=0

[Leaky]
beta=1.0
#threshold=1.0
reset_mechanism=subtract
learn_threshold=False

# 8x22x18 -> 16x20x16
[Conv2d]
in_channels=8
out_channels=16
kernel_size=3
stride=1
padding=0
#bias=False

# 16x20x16 -> 16x10x8
[MaxPool2d]
kernel_size=2
padding=0

[Leaky]
beta=1.0
#threshold=1.0
reset_mechanism=subtract
learn_threshold=False

# 16x10x8 -> 1280
[Flatten]

[Linear]
in_features=1280
out_features=128

[Leaky]
beta=1.0
#threshold=1.0
reset_mechanism=subtract
learn_threshold=False

# 256 -> 3
[Linear]
in_features=128
out_features=3

[Leaky]
beta=1.0
#threshold=1.0
reset_mechanism=subtract
learn_threshold=False

